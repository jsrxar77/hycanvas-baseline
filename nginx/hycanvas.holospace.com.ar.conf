# ==============================================================================
# Configuracion Nginx para HyCanvas (HoloSpace Platform)
# Dominio: hycanvas.holospace.com.ar
# Servidor Hetzner: /etc/nginx/sites-available/hycanvas.holospace.com.ar
# ==============================================================================

server {
    listen 80;
    server_name hycanvas.holospace.com.ar;

    # Limite de subida para disenos pesados, imagenes y videos
    client_max_body_size 100M;

    # Enrutamiento al contenedor HyCanvas en el puerto 8088
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        # Soporte para WebSockets (/realtime)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos para exportacion de videos y renderizado
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
